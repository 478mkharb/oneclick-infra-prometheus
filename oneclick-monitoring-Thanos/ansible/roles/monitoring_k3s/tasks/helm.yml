---
# 1. ADD HELM REPOSITORIES
- name: Add Helm repos
  shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
    helm repo add bitnami https://charts.bitnami.com/bitnami || true
    helm repo update
  args:
    executable: /bin/bash
  become: true

# 2. CREATE MONITORING NAMESPACE
- name: Create monitoring namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: monitoring
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  become: true

# 3. CREATE THANOS OBJECT STORE SECRET (MUST BE FIRST)
- name: Copy Thanos objstore config
  ansible.builtin.copy:
    src: objstore.yml
    dest: /tmp/objstore.yml
    mode: "0644"
  become: true

- name: Create / update Thanos objstore secret
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
      -n monitoring delete secret thanos-objstore --ignore-not-found

    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
      -n monitoring create secret generic thanos-objstore \
      --from-file=objstore.yml=/tmp/objstore.yml
  args:
    executable: /bin/bash
  become: true

# 4. DEPLOY KUBE-PROMETHEUS-STACK (PROMETHEUS + SIDECAR)
- name: Copy kube-prometheus-stack values file
  ansible.builtin.copy:
    src: values-kube-prometheus.yml
    dest: /tmp/kube-prometheus-values.yml
    mode: "0644"
  become: true

- name: Deploy kube-prometheus-stack
  ansible.builtin.shell: |
    helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
      --namespace monitoring \
      --create-namespace \
      -f /tmp/kube-prometheus-values.yml \
      --kubeconfig /etc/rancher/k3s/k3s.yaml
  args:
    executable: /bin/bash
  become: true

# 5. DEPLOY THANOS QUERY (BITNAMI)
- name: Copy Thanos Query values file
  ansible.builtin.copy:
    src: thanos-query-values.yml
    dest: /tmp/thanos-query-values.yml
    mode: "0644"
  become: true

- name: Deploy Thanos Query
  ansible.builtin.shell: |
    helm upgrade --install thanos-query bitnami/thanos \
      --namespace monitoring \
      -f /tmp/thanos-query-values.yml \
      --kubeconfig /etc/rancher/k3s/k3s.yaml
  args:
    executable: /bin/bash
  become: true
