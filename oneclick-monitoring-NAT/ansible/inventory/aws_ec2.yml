plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running
  tag:Project: oneclick-monitoring

keyed_groups:
  - key: tags.Role
    prefix: ""

hostnames:
  - instance-id

compose:
  private_ip: private_ip_address


vars:
  ansible_python_interpreter: /usr/bin/python3