plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running
  tag:Project: oneclick-monitoring

keyed_groups:
  - key: tags.Role
    prefix: ""

hostnames:
  - instance-id

compose:
  ansible_host: private_ip_address
  ansible_user: ubuntu

vars:
  ansible_connection: amazon.aws.aws_ssm
  ansible_aws_ssm_region: ap-south-1
  ansible_aws_ssm_bucket_name: oneclick-terraform.tf-nat
