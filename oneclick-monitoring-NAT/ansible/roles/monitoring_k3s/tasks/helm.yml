---
# Ensure helm repo exists (run once)
- name: Add Prometheus Helm repo
  become: true
  ansible.builtin.shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
    helm repo update
  args:
    executable: /bin/bash


# Create monitoring namespace via Kubernetes API
- name: Create monitoring namespace
  become: true
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: monitoring
    state: present
    kubeconfig: /root/.kube/config


# Render values file for Prometheus + Grafana
- name: Render kube-prometheus-stack values file
  become: true
  ansible.builtin.template:
    src: values.yml.j2
    dest: /tmp/kube-prometheus-values.yml
    mode: "0644"


# Check if helm release exists
- name: Check monitoring helm release status
  command: helm status monitoring -n monitoring
  register: helm_status
  failed_when: false
  changed_when: false


# Cleanup stuck helm secrets ONLY if release is broken
- name: Cleanup stuck helm secrets
  become: true
  shell: |
    kubectl delete secret -n monitoring \
      $(kubectl get secret -n monitoring | awk '/helm.release.v1.monitoring/ {print $1}') \
      --ignore-not-found
  when: helm_status.rc != 0
  ignore_errors: true




# First install (no wait / no atomic)
- name: Install kube-prometheus-stack (first install)
  become: true
  command: >
    helm upgrade --install monitoring
    prometheus-community/kube-prometheus-stack
    --namespace monitoring
    --create-namespace
    --timeout 30m
    --kubeconfig /root/.kube/config
    -f /tmp/kube-prometheus-values.yml
  when: helm_status.rc != 0



# Safe upgrade path (re-runs)
- name: Upgrade kube-prometheus-stack (existing release)
  become: true
  command: >
    helm upgrade monitoring
    prometheus-community/kube-prometheus-stack
    --namespace monitoring
    --timeout 30m
    --wait
    --kubeconfig /root/.kube/config
    -f /tmp/kube-prometheus-values.yml
  when: helm_status.rc == 0

