---

- name: Add prometheus Helm repo
  shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
    helm repo update
  args:
    executable: /bin/bash

- name: Create monitoring namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: monitoring
    state: present
    kubeconfig: /root/.kube/config
  become: true

- name: Add prometheus Helm repo
  shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
    helm repo update
  args:
    executable: /bin/bash
  become: true

- name: Render kube-prometheus-stack values file
  ansible.builtin.template:
    src: values.yml.j2
    dest: /tmp/kube-prometheus-values.yml
    mode: "0644"

- name: Deploy kube-prometheus-stack with custom values
  ansible.builtin.shell: |
    helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
      --namespace monitoring \
      --create-namespace \
      -f /tmp/kube-prometheus-values.yml
  args:
    executable: /bin/bash
  become: true
