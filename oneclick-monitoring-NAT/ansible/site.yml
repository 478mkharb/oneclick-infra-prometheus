---
- name: Setup k3s server and monitoring
  hosts: _k3s_server
  gather_facts: false
  
  vars:
    ansible_connection: amazon.aws.aws_ssm
    monitoring_namespace: monitoring
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    ansible_python_interpreter: /usr/bin/python3
  
  tasks:
    - name: test ssm
      command: whoami
  
  roles:
    - monitoring_k3s
    - k3s_install
