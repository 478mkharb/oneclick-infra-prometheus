groups:
- name: ec2-resource-alerts
  rules:

 
  # CPU ALERT 

  - alert: EC2HighCPUUsage
    expr: |
      100 - (
        rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[30s])
      ) * 100 > 80
    for: 10s
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on EC2"
      description: "CPU > 80% for 10s on {{ $labels.instance }}"


  # MEMORY ALERT
 
  - alert: EC2HighMemoryUsage
    expr: |
      (
        1 -
        (
          node_memory_MemAvailable_bytes{job="node-exporter"} /
          node_memory_MemTotal_bytes{job="node-exporter"}
        )
      ) * 100 > 85
    for: 10s
    labels:
      severity: warning
    annotations:
      summary: "High memory usage on EC2"
      description: "Memory > 85% for 10s on {{ $labels.instance }}"

  # DISK ALERT 

  - alert: EC2DiskSpaceLow
    expr: |
      (
        node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|overlay"} /
        node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|overlay"}
      ) * 100 < 15
    for: 10s
    labels:
      severity: critical
    annotations:
      summary: "Low disk space on EC2"
      description: "Disk < 15% on {{ $labels.instance }} mount {{ $labels.mountpoint }}"