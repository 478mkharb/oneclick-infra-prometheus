---
# Universal Grafana Installation + Dashboards Provisioning

- name: Ensure Grafana repo exists (RedHat only)
  copy:
    dest: /etc/yum.repos.d/grafana.repo
    content: |
      [grafana]
      name=Grafana OSS
      baseurl=https://packages.grafana.com/oss/rpm
      repo_gpgcheck=1
      enabled=1
      gpgcheck=1
      gpgkey=https://packages.grafana.com/gpg.key
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
  when: ansible_os_family == "RedHat"

- name: Install Grafana
  package:
    name: grafana
    state: present

- name: Install dependencies (RedHat only)
  package:
    name:
      - wget
      - policycoreutils-python-utils
      - python3-firewall
    state: present
  when: ansible_os_family == "RedHat"

# Stop Grafana before provisioning
- name: Stop Grafana service if exists
  systemd:
    name: grafana-server
    state: stopped
  ignore_errors: true

# Create required directories
- name: Create provisioning and dashboard directories
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

# Prometheus datasource
- name: Copy Prometheus datasource
  copy:
    src: datasource-prometheus.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"

# Dashboard provider config
- name: Copy dashboard provider config
  copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: grafana
    group: grafana
    mode: "0644"

# Copy dashboards
- name: Deploy Grafana dashboards
  copy:
    src: "{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop:
    - node-exporter.json
    - prometheus.json
    - blackbox.json

