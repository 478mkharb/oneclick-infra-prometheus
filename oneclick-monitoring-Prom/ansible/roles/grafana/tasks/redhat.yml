# Firewalld and ports (RedHat only)
- name: Ensure firewalld is installed and started
  package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat"

- name: Start firewalld
  service:
    name: firewalld
    state: started
    enabled: yes
  when: ansible_os_family == "RedHat"

- name: Open Prometheus port
  ansible.posix.firewalld:
    port: 9090/tcp
    permanent: yes
    state: enabled
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Open blackbox exporter port
  ansible.posix.firewalld:
    port: 9115/tcp
    permanent: yes
    state: enabled
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Open Grafana port
  ansible.posix.firewalld:
    port: 3000/tcp
    permanent: yes
    state: enabled
    immediate: yes
  when: ansible_os_family == "RedHat"

# Reload firewalld (RedHat only)
- name: Reload firewalld
  command: firewall-cmd --reload
  when: ansible_os_family == "RedHat"

# Enable and start Grafana (Universal)
- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: true
    state: started
