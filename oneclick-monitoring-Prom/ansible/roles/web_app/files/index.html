<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One-Click Infra Prometheus</title>

  <style>
    body {
      background: radial-gradient(circle at top, #1e1e2f, #0b0b12);
      font-family: Arial, sans-serif;
      color: #e0e0e0;
      text-align: center;
      padding-top: 120px;
      margin: 0;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p {
      font-size: 18px;
      color: #b0b0c3;
      margin-bottom: 50px;
    }

    .prometheus-link {
      display: inline-block;
      padding: 16px 36px;
      background: #e6522c;
      color: white;
      text-decoration: none;
      font-size: 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    .prometheus-link:hover {
      background: #ff6a3d;
    }

    .grafana-link {
      display: inline-block;
      margin-top: 30px;
      padding: 8px 16px;
      background: #1f8ef1;
      color: white;
      text-decoration: none;
      font-size: 14px;
      border-radius: 6px;
    }

    .grafana-link:hover {
      background: #4aa3ff;
    }

    footer {
      margin-top: 80px;
      font-size: 13px;
      color: #7a7a9a;
    }
  </style>
</head>

<body>

  <h1>One-Click Infra Prometheus</h1>
  <p>Automated Monitoring with Terraform · Jenkins · Ansible</p>

  <!-- Main Prometheus Entry -->
  <a class="prometheus-link" href="/prometheus/" target="_blank">
    Open Prometheus
  </a>

  <br>

  <!-- Small Grafana Button -->
  <a class="grafana-link" href="/grafana/" target="_blank">
    Grafana Dashboard
  </a>

  <footer>
    Project by Mukesh Kharb Team - Eklavya
  </footer>

</body>
</html>
