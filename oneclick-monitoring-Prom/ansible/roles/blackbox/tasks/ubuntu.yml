---
- name: Create blackbox user
  user:
    name: blackbox
    system: yes
    shell: /usr/sbin/nologin

- name: Download blackbox exporter
  get_url:
    url: https://github.com/prometheus/blackbox_exporter/releases/download/v0.25.0/blackbox_exporter-0.25.0.linux-amd64.tar.gz
    dest: /tmp/blackbox.tar.gz

- name: Extract blackbox exporter
  unarchive:
    src: /tmp/blackbox.tar.gz
    dest: /opt/
    remote_src: yes

- name: Install binary
  copy:
    src: /opt/blackbox_exporter-0.25.0.linux-amd64/blackbox_exporter
    dest: /usr/local/bin/blackbox_exporter
    mode: '0755'
    remote_src: yes

- name: Copy blackbox config
  copy:
    src: blackbox.yml
    dest: /etc/blackbox.yml
    owner: blackbox
    group: blackbox
    mode: '0644'

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/blackbox_exporter.service
    content: |
      [Unit]
      Description=Blackbox Exporter
      After=network.target

      [Service]
      User=blackbox
      Group=blackbox
      ExecStart=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart blackbox
