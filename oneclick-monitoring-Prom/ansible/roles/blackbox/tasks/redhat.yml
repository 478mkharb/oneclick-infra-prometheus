---
- name: Create blackbox user
  user:
    name: blackbox
    system: yes
    shell: /sbin/nologin

- name: Download blackbox exporter
  get_url:
    url: https://github.com/prometheus/blackbox_exporter/releases/download/v0.25.0/blackbox_exporter-0.25.0.linux-amd64.tar.gz
    dest: /tmp/blackbox.tar.gz

- name: Extract blackbox exporter
  unarchive:
    src: /tmp/blackbox.tar.gz
    dest: /opt/
    remote_src: yes

- name: Install blackbox binary
  copy:
    src: /opt/blackbox_exporter-0.25.0.linux-amd64/blackbox_exporter
    dest: /usr/local/bin/blackbox_exporter
    owner: blackbox
    group: blackbox
    mode: '0755'
    remote_src: yes

- name: Copy blackbox config
  copy:
    src: blackbox.yml
    dest: /etc/blackbox.yml
    owner: blackbox
    group: blackbox
    mode: '0644'

# -------- SELinux fixes --------

- name: Set SELinux context for blackbox config
  sefcontext:
    target: /etc/blackbox.yml
    setype: etc_t

- name: Set SELinux context for blackbox binary
  sefcontext:
    target: /usr/local/bin/blackbox_exporter
    setype: bin_t

- name: Apply SELinux contexts
  command: restorecon -Rv /etc/blackbox.yml /usr/local/bin/blackbox_exporter

# -------- Systemd service --------

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/blackbox_exporter.service
    content: |
      [Unit]
      Description=Blackbox Exporter
      After=network.target

      [Service]
      User=blackbox
      Group=blackbox
      ExecStart=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  command: systemctl daemon-reexec

- name: Enable and start blackbox exporter
  systemd:
    name: blackbox_exporter
    enabled: yes
    state: started
