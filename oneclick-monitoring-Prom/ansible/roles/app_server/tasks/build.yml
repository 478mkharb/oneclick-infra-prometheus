---
- name: Clone application repo
  git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    force: yes
  become: true
  tags: git

- name: Build application
  command: mvn clean package -DskipTests
  args:
    chdir: "{{ app_dir }}"
  become: true
  environment:
    MAVEN_OPTS: "-Xmx512m"
  notify: restart application
  tags: build

- name: Find built JAR file
  find:
    paths: "{{ app_dir }}/target"
    patterns: "*.jar"
  register: jar_result
  tags: build

- name: Fail if no JAR was built
  fail:
    msg: "No JAR file found in {{ app_dir }}/target"
  when: jar_result.matched == 0
