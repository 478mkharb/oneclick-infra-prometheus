---
- name: Configure Monitoring Stack
  hosts: _monitoring
  become: true
  become_user: root
  gather_facts: true

  pre_tasks:
    - name: Fetch ALB DNS from SSM
      set_fact:
        alb_dns: "{{ lookup('amazon.aws.aws_ssm', '/monitoring/alb_dns', region=aws_region) }}"

  roles:
    - prometheus
    - grafana
    - node_exporter
    - web_app
